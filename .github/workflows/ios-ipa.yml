# The release build of the unsigned iOS app,
# Spotifast-<version>-ios-unsigned.ipa, for sideloading with AltStore,
# SideStore or Sideloadly, which sign it with the user's own Apple ID.
# scripts/build-ipa.sh builds it on a macOS runner, without a compiler
# cache, and the run keeps it as an artifact. It runs for a v* tag and by
# hand from the Actions tab; the iOS port's check workflow (ios-probe.yml)
# builds an .ipa for every push.
name: iOS app (.ipa)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ipa:
    name: unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the toolchain, so the iOS standard library
      # is added after the checkout, where rustup resolves to that toolchain.
      - name: iOS standard library
        run: rustup target add aarch64-apple-ios
      # No compiler cache: like the release builds, the app people install
      # never builds from outputs restored from an Actions cache.
      - name: Build the .ipa
        run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Spotifast-ios-unsigned-ipa-release-${{ github.sha }}
          path: dist/*.ipa
          if-no-files-found: error
