[package]
name = "spotifast-ios"
description = "Spotifast's iOS app as a static library, for the Xcode project beside it"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
# The Xcode project (Spotifast.xcodeproj) links this archive,
# libspotifast_ios.a, into the app.
crate-type = ["staticlib"]
path = "src/lib.rs"

# Elsewhere the library is empty and builds nothing of the app.
[target.'cfg(target_os = "ios")'.dependencies]
# The whole app but MilkDrop, a C++ library with a window and an event loop
# of its own.
spotifast = { path = "..", default-features = false }
